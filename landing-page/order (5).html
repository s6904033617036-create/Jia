<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ยืนยันคำสั่งซื้อ — Doggy Gang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Taviraj:wght@300;400;500&family=IBM+Plex+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand-mark">Doggy Gang</a>
    <nav class="site-nav">
      <a href="product.html">สินค้าทั้งหมด</a>
    </nav>
  </div>
</header>

<main class="section">
  <div class="wrap-narrow">
    <h1 class="page-title">ยืนยันคำสั่งซื้อ</h1>

    <form id="orderForm" class="order-form">

      <div class="form-field">
        <label for="customerName">ชื่อลูกค้า</label>
        <input type="text" id="customerName" name="customerName" required>
      </div>

      <div class="form-field">
        <label for="contact">เบอร์โทร / Line</label>
        <input type="text" id="contact" name="contact" required>
      </div>

      <div class="form-field">
        <label for="items">รายการสินค้า</label>
        <input type="text" id="items" name="items" required>
      </div>

      <div class="form-field">
        <label for="total">จำนวนเงินรวม</label>
        <input type="text" id="total" name="total" required>
      </div>

      <div class="form-field">
        <label for="note">หมายเหตุ</label>
        <textarea id="note" name="note" rows="3"></textarea>
      </div>

      <button type="submit" class="btn-outline btn-submit">ยืนยันสั่งซื้อ</button>

    </form>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    &copy; 2026 Doggy Gang
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
